name: Publish Orchestrator

# ORCHESTRATOR WORKFLOW
# This workflow orchestrates the building and publishing of projectM for Android.
# It checks for new releases and snapshot updates, then triggers individual version
# builds using the publish-version workflow with max-parallel=1 to avoid Maven
# metadata update race conditions on GitHub Pages.
# 
# GitHub Pages hosts the Maven repo, and Gradle rewrites maven-metadata.xml using
# the existing file contents, so concurrent publishes clobber earlier versions.

# Prevent concurrent orchestrator runs
concurrency:
  group: publish-orchestrator
  cancel-in-progress: false

on:
  # Manual trigger
  workflow_dispatch:

  # Scheduled daily check
  schedule:
    - cron: '17 3 * * *'

  # Push to main for testing
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish.yml'
      - '.github/workflows/publish-version.yml'
      - '.github/patches/**'

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  # Check for new projectM releases and snapshot updates
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_builds: ${{ steps.check.outputs.has_builds }}

    steps:
    - name: Checkout publisher repo
      uses: actions/checkout@v4

    - name: Check for new projectM releases and snapshots
      id: check
      run: |
        BUILDS='[]'

        # Check for both new releases and snapshot updates
        echo "Checking for new releases and snapshot updates"

        # Check latest projectM release
        LATEST_RELEASE=$(curl -s https://api.github.com/repos/projectM-visualizer/projectm/releases/latest | jq -r .tag_name)
        VERSION=${LATEST_RELEASE#v}

        if [ "$LATEST_RELEASE" != "null" ] && [ -n "$VERSION" ]; then
          METADATA_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/net/protyposis/projectm-unofficial/projectm-android/maven-metadata.xml"
          METADATA_CONTENT=$(curl -sf "$METADATA_URL" || true)

          if echo "$METADATA_CONTENT" | grep -q "<version>$VERSION</version>"; then
            echo "Release $VERSION already published"
          else
            echo "New projectM release found: $LATEST_RELEASE"
            BUILDS=$(echo "$BUILDS" | jq -c '. + [{"projectm_ref": "'$LATEST_RELEASE'", "version": "'$VERSION'"}]')
          fi
        fi

        # Check snapshot branches for changes in last 24 hours
        YESTERDAY_EPOCH=$(date -d "24 hours ago" +%s)

        # Define snapshot branches to check
        SNAPSHOT_BRANCHES=(
          "master"
          "v4.1.x"
        )

        # Check each snapshot branch
        for BRANCH in "${SNAPSHOT_BRANCHES[@]}"; do
          COMMIT_TIME=$(curl -s https://api.github.com/repos/projectM-visualizer/projectm/commits/$BRANCH | jq -r '.commit.committer.date')
          if [ "$COMMIT_TIME" != "null" ]; then
            COMMIT_EPOCH=$(date -d "$COMMIT_TIME" +%s)

            if [ "$COMMIT_EPOCH" -gt "$YESTERDAY_EPOCH" ]; then
              echo "$BRANCH branch has new commits, adding to build matrix"
              BUILDS=$(echo "$BUILDS" | jq -c '. + [{"projectm_ref": "'$BRANCH'", "version": "'$BRANCH'-SNAPSHOT"}]')
            fi
          fi
        done

        BUILD_COUNT=$(echo "$BUILDS" | jq 'length')
        if [ "$BUILD_COUNT" -eq 0 ]; then
          echo "No new releases or snapshot changes found"
          echo "has_builds=false" >> $GITHUB_OUTPUT
          echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
        else
          echo "Found $BUILD_COUNT build(s) to process"
          echo "Builds: $BUILDS"
          echo "has_builds=true" >> $GITHUB_OUTPUT
          echo "matrix={\"include\":$BUILDS}" >> $GITHUB_OUTPUT
        fi

  # Build and publish each version sequentially
  publish-versions:
    needs: check-versions
    if: needs.check-versions.outputs.has_builds == 'true'
    strategy:
      matrix: ${{ fromJson(needs.check-versions.outputs.matrix) }}
      max-parallel: 1  # Prevent Maven metadata race conditions
      fail-fast: false  # Continue with other builds if one fails
    uses: ./.github/workflows/publish-version.yml
    with:
      projectm_ref: ${{ matrix.projectm_ref }}
      version: ${{ matrix.version }}
    secrets:
      PAT_WORKFLOW: ${{ secrets.PAT_WORKFLOW }}

  # Summary job for status reporting
  summary:
    needs: [check-versions, publish-versions]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Report build summary
      run: |
        if [ "${{ needs.check-versions.outputs.has_builds }}" == "false" ]; then
          echo "No new versions to build."
        elif [ "${{ needs.publish-versions.result }}" == "success" ]; then
          echo "All versions published successfully!"
        elif [ "${{ needs.publish-versions.result }}" == "failure" ]; then
          echo "Some version builds failed. Check the logs for details."
        else
          echo "Build process was cancelled or skipped."
        fi